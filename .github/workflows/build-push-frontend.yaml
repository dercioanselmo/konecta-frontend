name: Build and Push Frontend to ECR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: konecta/konecta-frontend
  AWS_ACCOUNT_ID1: 564956047797

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Debug info
        run: |
          echo "Repository          : ${{ github.repository }}"
          echo "Repository owner    : ${{ github.repository_owner }}"
          echo "Ref                 : ${{ github.ref }}"
          echo "AWS_ACCOUNT_ID      : ${{ env.AWS_ACCOUNT_ID1 }}"
          echo "Role that will be assumed:"
          echo "arn:aws:iam::${{ env.AWS_ACCOUNT_ID1 }}:role/github-actions-oidc-role-Konecta"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID1 }}:role/github-actions-oidc-role-Konecta
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Define image tags
        run: |
          SHA_TAG=sha-${GITHUB_SHA::7}
          IMAGE_BASE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          echo "SHA_TAG=$SHA_TAG" >> $GITHUB_ENV
          echo "IMAGE_BASE=$IMAGE_BASE" >> $GITHUB_ENV
          echo "TAGS=latest $SHA_TAG" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t $IMAGE_BASE:$SHA_TAG .

      - name: Tag and push
        run: |
          docker tag $IMAGE_BASE:$SHA_TAG $IMAGE_BASE:latest
          for tag in $TAGS; do
            echo "Pushing $IMAGE_BASE:$tag"
            docker push $IMAGE_BASE:$tag
          done